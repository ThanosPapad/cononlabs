<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conon Labs</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- marked.js for rendering markdown content -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       STICKY NAV
  ═══════════════════════════════════════════ -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="#hero" class="nav-logo-link">
        <img src="assets/images/conon_logo.png" alt="Conon Labs" class="nav-logo" id="navLogo" />
      </a>
      <ul class="nav-links">
        <li><a href="#about"    class="nav-link" data-section="about">About</a></li>
        <li><a href="#products" class="nav-link" data-section="products">Products</a></li>
        <li><a href="#services" class="nav-link" data-section="services">Services</a></li>
        <li><a href="#team"     class="nav-link" data-section="team">Team</a></li>
        <li><a href="#research" class="nav-link" data-section="research">Research</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile drawer -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#about"    class="mob-link" data-section="about">About</a>
    <a href="#products" class="mob-link" data-section="products">Products</a>
    <a href="#services" class="mob-link" data-section="services">Services</a>
    <a href="#team"     class="mob-link" data-section="team">Team</a>
    <a href="#research" class="mob-link" data-section="research">Research</a>
  </div>

  <!-- ═══════════════════════════════════════════
       HERO
  ═══════════════════════════════════════════ -->
  <section id="hero">
    <canvas id="starfield"></canvas>
    <div class="hero-content">
      <img src="assets/images/conon_logo.png" alt="Conon Labs" class="hero-logo" id="heroLogo" />
      <p class="hero-tagline">Engineering the Edge of What's Possible</p>
      <p class="hero-sub">Space &amp; terrestrial electronics · Embedded systems · Deep tech</p>
      <a href="#about" class="hero-cta">Explore</a>
    </div>
    <div class="hero-scroll-hint">
      <span></span>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       CONTENT SECTIONS — filled from markdown
  ═══════════════════════════════════════════ -->
  <main>
    <section id="about"    class="content-section"><div class="section-inner md-content" data-md="content/about.md"></div></section>
    <section id="products" class="content-section"><div class="section-inner md-content" data-md="content/products.md"></div></section>
    <section id="services" class="content-section"><div class="section-inner md-content" data-md="content/services.md"></div></section>
    <section id="team"     class="content-section"><div class="section-inner md-content" data-md="content/team.md"></div></section>
    <section id="research" class="content-section"><div class="section-inner md-content" data-md="content/research.md"></div></section>
  </main>

  <!-- ═══════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════ -->
  <footer>
    <div class="footer-inner">
      <span class="footer-name">Conon Labs</span>
      <span class="footer-copy">&copy; <span id="year"></span>. All rights reserved.</span>
      <a href="https://github.com/ThanosPapad/cononlabs" class="footer-gh" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.31.468-2.381 1.235-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.3 1.23A11.51 11.51 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.652.242 2.873.118 3.176.77.84 1.234 1.911 1.234 3.221 0 4.609-2.807 5.624-5.479 5.923.43.372.823 1.102.823 2.222 0 1.604-.015 2.896-.015 3.286 0 .322.216.694.825.576C20.565 21.796 24 17.298 24 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
