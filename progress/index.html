<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Our Progress — Conon Labs</title>

  <meta property="og:title"       content="Our Progress — Conon Labs" />

  <!-- Favicons (root-relative so they resolve from /progress/) -->
  <link rel="icon" type="image/x-icon"  href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="apple-touch-icon"          href="/assets/images/favicon.png" />

  <!-- Your real stylesheet, root-relative -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Progress-page-only additions:
       - space content below the fixed nav (this page has no hero)
       - size images/video to the text column WITHOUT the invert filter
         that .md-image uses elsewhere (that one is for line-art diagrams;
         it would wreck photos/screenshots). -->
  <style>
    main { padding-top: var(--nav-h); }

    /* ── Progress page: technical-document treatment ─────────── */
    .md-content { counter-reset: section figure; }

    /* Masthead kicker above the title */
    .md-content .doc-kicker {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* Lead paragraph (first line after the title) */
    .md-content h1 + p {
      font-size: 16px;
      line-height: 1.7;
      color: var(--dim);
      max-width: 660px;
    }

    /* Auto-numbered section headings: 01 / , 02 / ... */
    .md-content h2 { counter-increment: section; }
    .md-content h2::before {
      content: counter(section, decimal-leading-zero) "  /  ";
      color: var(--muted);
    }

    /* Figures — every standalone markdown image becomes a framed plate */
    .md-content p:has(> img) {
      counter-increment: figure;
      position: relative;
      max-width: none;
      margin: 44px 0 10px;
      border: 1px solid var(--line);
      background: var(--bg2);
      transition: border-color 0.3s ease;
    }
    .md-content p:has(> img):hover { border-color: rgba(255,255,255,0.22); }
    .md-content p:has(> img) img {
      display: block;
      width: 100%;
      margin: 0;
      filter: none;   /* screenshots stay true-color, unlike .md-image */
    }

    /* Video — same framed treatment */
    .md-content video {
      display: block;
      width: 100%;
      max-width: none;
      margin: 44px 0 10px;
      border: 1px solid var(--line);
      background: var(--bg2);
    }

    /* Captions — a line that is only *italic* becomes a figure caption */
    .md-content p:has(> em:only-child) {
      max-width: none;
      margin: 0 0 44px;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .md-content p:has(> em:only-child) em { font-style: normal; }

    /* Click-to-enlarge affordance on every figure's media */
    .md-content figure img,
    .md-content figure video {
      cursor: zoom-in;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      user-select: none;
    }

    /* Lightbox overlay */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5vh 5vw;
      background: rgba(8, 8, 8, 0.92);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img,
    .lightbox video {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    .lightbox-close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--bg2);
      color: var(--accent);
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ═══ STICKY NAV (kept solid: no hero on this page) ═══ -->
  <nav id="navbar" class="scrolled">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="/assets/images/conon_logo_2.png" alt="Conon Labs" class="nav-logo" id="navLogo" />
      </a>
      <ul class="nav-links">
        <li><a href="/#about"    class="nav-link">About</a></li>
        <li><a href="/#products" class="nav-link">Products</a></li>
        <li><a href="/#services" class="nav-link">Services</a></li>
        <li><a href="/#team"     class="nav-link">Team</a></li>
        <li><a href="/#research" class="nav-link">Research</a></li>
        <li><a href="/#contact"  class="nav-link">Contact</a></li>
        <li><a href="/sat_track/" class="nav-cta">Sat Track</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>

  </nav>

  <!-- Mobile drawer -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="/#about"    class="mob-link">About</a>
    <a href="/#products" class="mob-link">Products</a>
    <a href="/#services" class="mob-link">Services</a>
    <a href="/#team"     class="mob-link">Team</a>
    <a href="/#research" class="mob-link">Research</a>
    <a href="/#contact"  class="mob-link">Contact</a>
    <a href="/sat_track/" class="nav-cta">Sat Track</a>
  </div>

  <!-- ═══ CONTENT — filled from markdown, same pattern as the homepage ═══ -->
  <main>
    <section class="content-section">
      <div class="section-inner md-content" data-md="/content/progress.md">
        <p class="md-loading">Loading…</p>
      </div>
    </section>
  </main>

  <!-- ═══ FOOTER ═══ -->
  <footer>
    <div class="footer-inner">
      <span class="footer-copy">Conon Labs &copy; <span id="year"></span>. All rights reserved.</span>
      <a href="https://github.com/ThanosPapad/cononlabs" class="footer-gh" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.31.468-2.381 1.235-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.3 1.23A11.51 11.51 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.652.242 2.873.118 3.176.77.84 1.234 1.911 1.234 3.221 0 4.609-2.807 5.624-5.479 5.923.43.372.823 1.102.823 2.222 0 1.604-.015 2.896-.015 3.286 0 .322.216.694.825.576C20.565 21.796 24 17.298 24 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </footer>

  <!-- Lightbox overlay: populated on click from the figure media below -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  </div>

  <!-- Self-contained script: renders the markdown, reveals the section,
       sets the year, and wires the mobile menu. No dependency on main.js. -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const burger = document.getElementById('hamburger');
    const menu = document.getElementById('mobileMenu');
    if (burger && menu) {
      burger.addEventListener('click', () => {
        burger.classList.toggle('open');
        menu.classList.toggle('open');
      });
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(source) {
      const clone = source.cloneNode(true);
      clone.removeAttribute('style');
      if (clone.tagName === 'VIDEO') {
        clone.removeAttribute('autoplay');
        clone.removeAttribute('loop');
        clone.controls = true;
        clone.muted = false;
        clone.load();
      }
      lightbox.querySelectorAll('img, video').forEach((el) => el.remove());
      lightbox.appendChild(clone);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
      lightbox.querySelectorAll('video').forEach((v) => v.pause());
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('[data-md]').forEach(async (el) => {
      const section = el.closest('.content-section');
      try {
        const res = await fetch(el.getAttribute('data-md'));
        if (!res.ok) throw new Error(res.status);
        el.innerHTML = marked.parse(await res.text());
        // Videos injected via innerHTML need muted set as a PROPERTY (not just
        // the attribute) or the browser blocks autoplay and shows only the poster.
        el.querySelectorAll('video').forEach((v) => {
          v.muted = true;
          v.setAttribute('muted', '');
          v.play().catch(() => {});
        });
        el.querySelectorAll('figure img, figure video').forEach((media) => {
          media.addEventListener('click', () => openLightbox(media));
        });
      } catch (e) {
        el.innerHTML = '<p>Couldn\u2019t load the content. Check that ' +
          'content/progress.md exists and that you\u2019re viewing this over a ' +
          'server (not by opening the file directly).</p>';
      }
      if (section) section.classList.add('visible');
    });
  </script>
  <script data-goatcounter="https://thanospapad.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <script src="assets/js/main.js"></script>
</body>
