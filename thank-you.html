<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Conon Labs</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg, #0b0f1a);
      color: var(--text, #e8eaf0);
      font-family: inherit;
      text-align: center;
      padding: 2rem;
    }
    .ty-logo { width: 200px; max-width: 80vw; margin-bottom: 2rem; }
    .ty-title { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
    .ty-sub { font-size: 1.1rem; opacity: 0.7; margin-bottom: 2rem; }
    .ty-back {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border: 1px solid currentColor;
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .ty-back:hover { opacity: 1; }
  </style>
</head>
<body>
  <img src="assets/images/conon_logo_2.png" alt="Conon Labs" class="ty-logo" />
  <p class="ty-title">Thank you!</p>
  <p class="ty-sub">We'll get back to you soon.</p>
  <a href="/" class="ty-back">← Back to site</a>
</body>
</html>
